<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Snippet Fidelity catches copy-button regressions</title>
  <desc id="desc">A synthetic reproducible example showing canonical text, a copied payload with an extra newline, and an audit report that detects five classes of clipboard regression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="50" r="210" fill="#2563eb" opacity="0.08"/>
  <circle cx="80" cy="620" r="180" fill="#14b8a6" opacity="0.07"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(64 54)">
      <rect width="42" height="42" rx="12" fill="url(#accent)"/>
      <path d="M12 13h18M12 21h12M12 29h18" stroke="#07101f" stroke-width="3.5" stroke-linecap="round"/>
      <text x="58" y="30" fill="#f8fafc" font-size="28" font-weight="700">Snippet Fidelity</text>
      <rect x="308" y="4" width="170" height="34" rx="17" fill="#172554" stroke="#3b82f6"/>
      <text x="393" y="27" fill="#bfdbfe" font-size="14" text-anchor="middle" font-weight="600">BROWSER EVIDENCE</text>
    </g>

    <text x="64" y="154" fill="#f8fafc" font-size="45" font-weight="750">Your docs can look right</text>
    <text x="64" y="204" fill="#94a3b8" font-size="45" font-weight="650">and still copy wrong.</text>

    <g filter="url(#shadow)">
      <g transform="translate(64 252)">
        <rect width="335" height="230" rx="18" fill="#111827" stroke="#334155"/>
        <circle cx="28" cy="28" r="7" fill="#22c55e"/>
        <text x="46" y="34" fill="#cbd5e1" font-size="15" font-weight="700">CANONICAL TEXT</text>
        <rect x="22" y="62" width="291" height="68" rx="11" fill="#020617" stroke="#1e293b"/>
        <text x="40" y="102" fill="#e2e8f0" font-family="Cascadia Code, Consolas, monospace" font-size="17">npm install safe-package</text>
        <rect x="22" y="151" width="68" height="28" rx="14" fill="#052e2b"/>
        <text x="56" y="170" fill="#5eead4" font-size="12" text-anchor="middle" font-weight="700">EOF</text>
        <text x="22" y="207" fill="#64748b" font-size="14">What the maintainer intended</text>
      </g>

      <g transform="translate(433 252)">
        <rect width="335" height="230" rx="18" fill="#111827" stroke="#7f1d1d"/>
        <circle cx="28" cy="28" r="7" fill="#ef4444"/>
        <text x="46" y="34" fill="#fecaca" font-size="15" font-weight="700">COPIED PAYLOAD</text>
        <rect x="22" y="62" width="291" height="68" rx="11" fill="#020617" stroke="#450a0a"/>
        <text x="40" y="102" fill="#e2e8f0" font-family="Cascadia Code, Consolas, monospace" font-size="17">npm install safe-package</text>
        <rect x="22" y="151" width="116" height="28" rx="14" fill="#450a0a"/>
        <text x="80" y="170" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="700">+ U+000A</text>
        <text x="22" y="207" fill="#f87171" font-size="14">Invisible extra newline</text>
      </g>

      <g transform="translate(802 252)">
        <rect width="334" height="230" rx="18" fill="#111827" stroke="#0f766e"/>
        <circle cx="28" cy="28" r="7" fill="#5eead4"/>
        <text x="46" y="34" fill="#ccfbf1" font-size="15" font-weight="700">AUDIT RESULT</text>
        <text x="22" y="91" fill="#f8fafc" font-size="34" font-weight="750">1 / 6 passed</text>
        <text x="22" y="121" fill="#f87171" font-size="15" font-weight="650">5 failed · 0 errors</text>
        <g font-size="12" font-weight="650">
          <rect x="22" y="145" width="104" height="27" rx="13" fill="#172554"/><text x="74" y="163" fill="#bfdbfe" text-anchor="middle">newline</text>
          <rect x="135" y="145" width="104" height="27" rx="13" fill="#172554"/><text x="187" y="163" fill="#bfdbfe" text-anchor="middle">indentation</text>
          <rect x="22" y="181" width="104" height="27" rx="13" fill="#172554"/><text x="74" y="199" fill="#bfdbfe" text-anchor="middle">zero-width</text>
          <rect x="135" y="181" width="154" height="27" rx="13" fill="#172554"/><text x="212" y="199" fill="#bfdbfe" text-anchor="middle">Unicode normalize</text>
        </g>
      </g>
    </g>

    <path d="M80 532h1040" stroke="#334155"/>
    <text x="64" y="575" fill="#94a3b8" font-size="18">rendered page</text>
    <text x="200" y="575" fill="#475569" font-size="20">→</text>
    <text x="235" y="575" fill="#94a3b8" font-size="18">copy handler</text>
    <text x="367" y="575" fill="#475569" font-size="20">→</text>
    <text x="402" y="575" fill="#94a3b8" font-size="18">browser clipboard</text>
    <text x="1136" y="575" fill="#5eead4" font-size="17" text-anchor="end" font-weight="700">github.com/WLDKK/snippet-fidelity</text>
    <text x="64" y="607" fill="#475569" font-size="13">Synthetic, reproducible adversarial fixture · exact Unicode code-point comparison</text>
  </g>
</svg>
