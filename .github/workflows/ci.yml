name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Ensure the committed action build is current
        run: git diff --exit-code -- dist
      - name: Start the positive fixture
        shell: bash
        run: |
          node scripts/serve-fixture.mjs > "$RUNNER_TEMP/snippet-fidelity-fixture.log" 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/
      - name: Exercise the repository as an action
        id: action-smoke
        uses: ./
        with:
          config: examples/action-smoke.config.json
          output-dir: artifacts/action-smoke
      - name: Verify the action report contract
        env:
          SNIPPET_FIDELITY_REPORT_DIRECTORY: ${{ steps.action-smoke.outputs.report-directory }}
          SNIPPET_FIDELITY_OUTCOME: ${{ steps.action-smoke.outputs.outcome }}
          SNIPPET_FIDELITY_TOTAL: ${{ steps.action-smoke.outputs.total }}
          SNIPPET_FIDELITY_PASSED: ${{ steps.action-smoke.outputs.passed }}
          SNIPPET_FIDELITY_FAILED: ${{ steps.action-smoke.outputs.failed }}
          SNIPPET_FIDELITY_ERRORS: ${{ steps.action-smoke.outputs.errors }}
        run: node scripts/verify-action-report.mjs artifacts/action-smoke/snippet-fidelity.json
